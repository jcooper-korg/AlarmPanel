- id: '1600468865168'
  alias: Trigger Immediately on Smoke
  description: Smoke/CO triggers immediately in ANY state (no condition) via the
    trigger_alarm_immediately script. If disarmed, the script triggers directly so
    the system returns to disarmed after trigger_time.
  trigger:
  - entity_id: binary_sensor.hall_smoke
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.carbon_monoxide_kitchen
    from: 'off'
    platform: state
    to: 'on'
  condition: []
  action:
  - data_template:
      entity_id: input_text.trigger_source
      value: '{{ trigger.to_state.attributes.friendly_name }}'
    service: input_text.set_value
  - data: {}
    service: script.trigger_alarm_immediately
  mode: single
- id: '1600472249835'
  alias: Trigger Pending When Armed Away
  description: Entry doors while armed_away call alarm_trigger directly, so the panel
    uses armed_away's delay_time (30s pending) -- this is the entry delay, and it is
    what the card's countdown timer watches.
  trigger:
  - entity_id: binary_sensor.front_door
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.back_door
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.garage_door
    from: 'off'
    platform: state
    to: 'on'
  condition:
  - condition: state
    entity_id: alarm_control_panel.house
    state: armed_away
  action:
  - data: {}
    entity_id: alarm_control_panel.house
    service: alarm_control_panel.alarm_trigger
  mode: single
