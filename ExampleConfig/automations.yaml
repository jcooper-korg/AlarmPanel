- id: '1598210904880'
  alias: Turn on Beeper
  description: When entering pending or warning state, sound the beeper
  triggers:
  - entity_id: alarm_control_panel.house
    from: disarmed
    to: arming
    trigger: state
  - entity_id: alarm_control_panel.house
    to: pending
    trigger: state
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: light.alarm_panel_warning_beep
    data:
      effect: Strobe
  mode: single
- id: '1598211133176'
  alias: Alarm Triggered
  description: ''
  triggers:
  - entity_id: alarm_control_panel.house
    to: triggered
    trigger: state
  conditions: []
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.siren
    data: {}
  - data:
      data:
        subtitle: The Alarm is Sounding
      message: 'Home Alarm triggered by: {{ states(''input_text.trigger_source'')
        }}'
      title: Smart Home Alert
    action: notify.alarm_notification_group
  mode: single
- id: '1598211302522'
  alias: Alarm Disarmed or Trigger Expired
  description: Turn off siren/beep/LED when alarm exits triggered or becomes disarmed.
    Also fires on the from-triggered transition so the siren turns off when
    trigger_time expires (not only on an explicit disarm).
  triggers:
  - entity_id: alarm_control_panel.house
    to: disarmed
    trigger: state
  - entity_id: alarm_control_panel.house
    from: triggered
    trigger: state
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.siren
    data: {}
  - action: light.turn_off
    target:
      entity_id: light.alarm_panel_warning_beep
    data: {}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''disarmed'' }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.red_led
        data: {}
      - data:
          title: Smart Home Alert
          message: Alarm Disarmed
        action: notify.alarm_notification_group
    default:
    - data:
        title: Smart Home Alert
        message: Alarm trigger expired, returned to {{ trigger.to_state.state }}
      action: notify.alarm_notification_group
  mode: single
- id: '1598213488706'
  alias: All zones clear while disarmed
  description: Turn on the green LED when all zones are clear while disarmed
  triggers:
  - entity_id: group.alarm_zones_for_led
    from: 'on'
    to: 'off'
    trigger: state
  - entity_id: alarm_control_panel.house
    to: disarmed
    trigger: state
  conditions:
  - condition: state
    entity_id: alarm_control_panel.house
    state: disarmed
  - condition: state
    entity_id: group.alarm_zones_for_led
    state: 'off'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.green_led
    data: {}
  mode: single
- id: '1598213553348'
  alias: Alarm zone opened while disarmed
  description: Turn off the green LED when any alarm zone is open while disarmed
  triggers:
  - entity_id: group.alarm_zones_for_led
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: alarm_control_panel.house
    state: disarmed
  - condition: state
    entity_id: group.alarm_zones_for_led
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.green_led
    data: {}
  mode: single
- id: '1598213810560'
  alias: Alarm Armed
  description: ''
  triggers:
  - entity_id: alarm_control_panel.house
    to: armed_home
    trigger: state
  - entity_id: alarm_control_panel.house
    to: armed_away
    trigger: state
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.green_led
    data: {}
  - action: switch.turn_on
    target:
      entity_id: switch.red_led
    data: {}
  - action: light.turn_off
    target:
      entity_id: light.alarm_panel_warning_beep
    data: {}
  - data:
      title: Smart Home Alert
      message: Alarm Armed
    action: notify.alarm_notification_group
  mode: single
- id: '1600468597816'
  alias: Trigger Immediately when Arming
  description: While still arming, instant sensors fire immediately (no entry delay)
    via the trigger_alarm_immediately script.
  trigger:
  - entity_id: binary_sensor.office_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.living_room_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.kitchen_sink_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.kitchen_table_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.dining_room_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.master_bedroom_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.master_bath_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.bedroom1_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.bedroom2_window
    from: 'off'
    platform: state
    to: 'on'
  - entity_id: binary_sensor.side_garage_door
    from: 'off'
    platform: state
    to: 'on'
  condition:
  - condition: state
    entity_id: alarm_control_panel.house
    state: arming
  action:
  - data_template:
      entity_id: input_text.trigger_source
      value: '{{ trigger.to_state.attributes.friendly_name }}'
    service: input_text.set_value
  - data: {}
    service: script.trigger_alarm_immediately
  mode: single
